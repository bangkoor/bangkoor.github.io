<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arif K Wijayanto - Geospatial Research & Insights</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    
    <script>
      // Prevent flash of unstyled content (FOUC) and handle dark mode
      (function() {
        const savedTheme = localStorage.getItem('blog-theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0f0f0e] transition-colors duration-200">
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100%; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif;">
        <div style="text-align: center;">
          <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #1a1a18;">Arif K Wijayanto</h1>
          <p style="color: #6b6b65; font-size: 0.9rem;">Loading experience...</p>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
